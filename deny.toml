# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# Fail on any RustSec vulnerability or unsound/unmaintained advisory affecting our dependency tree.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are unpublished and unlicensed.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside the workspace are fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
