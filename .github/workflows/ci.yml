name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. Only the deploy job asks for more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the channel and components; this installs them.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  dynamo-local:
    name: DynamoStore against DynamoDB Local
    runs-on: ubuntu-latest
    services:
      dynamodb:
        # Pinned by digest; Dependabot doesn't track service images, so bump this by hand.
        image: amazon/dynamodb-local@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked -p choosey-store --test dynamo_local -- --ignored
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  terraform:
    name: terraform fmt, validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # infra/ is added separately; skip cleanly until it exists.
      - id: infra
        run: |
          if [ -d infra ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.infra.outputs.present == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - if: steps.infra.outputs.present == 'true'
        run: terraform fmt -check -recursive
        working-directory: infra
      - if: steps.infra.outputs.present == 'true'
        run: terraform init -backend=false -input=false
        working-directory: infra
      - if: steps.infra.outputs.present == 'true'
        run: terraform validate
        working-directory: infra

  deploy:
    name: deploy to Lambda
    needs: [rust, dynamo-local, deny, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Never run two deploys at once; don't cancel one half way through.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # for the GitHub OIDC -> AWS role exchange
    steps:
      # Skip (rather than fail) until the infrastructure and its variables exist.
      # Checked in a step, not in the job's `if`, so environment-level variables work too.
      - id: gate
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$ROLE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::vars.AWS_DEPLOY_ROLE_ARN is not set; skipping deploy."
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.enabled == 'true'
        run: rustup toolchain install
      - if: steps.gate.outputs.enabled == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lambda
      - if: steps.gate.outputs.enabled == 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - if: steps.gate.outputs.enabled == 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-lambda@1.9.2
      - if: steps.gate.outputs.enabled == 'true'
        run: cargo lambda build --release --arm64 --output-format zip -p choosey-web --locked
      - if: steps.gate.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - if: steps.gate.outputs.enabled == 'true'
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://target/lambda/choosey/bootstrap.zip \
            --publish \
            --query '{Version: Version, CodeSha256: CodeSha256}'
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
